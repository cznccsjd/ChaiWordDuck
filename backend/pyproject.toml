[project]
name = "chaiword-duck-backend"
version = "0.1.0"
description = "拆词鸭后端API - 专注于成人英语长单词学习"
authors = [
    {name = "ChaiWord Duck Team", email = "dev@chaiwordduck.com"},
]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]==0.24.0",
    "sqlalchemy==2.0.23",
    "asyncpg>=0.30.0",
    "pydantic==2.8.2",
    "pydantic-core==2.20.1",
    "pydantic-settings==2.4.1",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "redis[hiredis]==5.0.1",
    "openai>=2.3.0",
    "apscheduler==3.10.4",
    "python-multipart==0.0.6",
    "python-dotenv==1.0.0",
    "alembic==1.12.1",
    "email-validator==2.1.0",
    "bcrypt==4.1.2",
    "google-genai>=1.45.0",
    "aiohttp>=3.13.1",
    "PyYAML>=6.0.3",
    "psycopg2-binary>=2.9.11",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "httpx>=0.28.1",
    "faker==20.1.0",
    "black==23.11.0",
    "ruff==0.1.6",
    "mypy==1.7.1",
    "aiosqlite>=0.21.0",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pdm.dev-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "httpx>=0.28.1",
    "faker>=20.1.0",
    "black>=23.11.0",
    "ruff>=0.1.6",
    "mypy>=1.7.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=95",
]

[tool.black]
line-length = 120
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | \.eggs
  | __pycache__
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 120
target-version = "py311"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
