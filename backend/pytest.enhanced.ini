[tool:pytest]
# 增强的pytest配置

# 测试发现
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 输出配置
addopts =
    -v
    --tb=short
    --strict-markers
    --strict-config
    --disable-warnings
    --color=yes
    --durations=10
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
    --cov-fail-under=80

# 标记定义
markers =
    # 测试类型标记
    unit: Unit tests (测试单个函数/类)
    integration: Integration tests (测试组件间集成)
    e2e: End-to-end tests (测试完整用户流程)
    api: API tests (测试API接口)
    multilang: Multi-language tests (测试多语言功能)

    # 测试优先级标记
    critical: Critical tests (关键测试，必须通过)
    high: High priority tests (高优先级测试)
    medium: Medium priority tests (中优先级测试)
    low: Low priority tests (低优先级测试)

    # 测试状态标记
    slow: Slow running tests (运行时间较长的测试)
    flaky: Flaky tests (可能不稳定的测试)
    wip: Work in progress tests (开发中的测试)

    # 性能和并发标记
    performance: Performance tests (性能测试)
    concurrent: Concurrent execution tests (并发执行测试)
    isolation: Isolation tests (隔离测试)

    # 数据库标记
    database: Database tests (需要数据库的测试)
    db_isolation: Database isolation tests (数据库隔离测试)

    # 外部服务标记
    external: External service tests (依赖外部服务的测试)
    mock: Mock tests (使用Mock的测试)

# 最小版本要求
minversion = 6.0

# 异步测试配置
asyncio_mode = auto

# 过滤警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:distutils
    ignore::UserWarning:_pytest

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests/logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d %(funcName)s(): %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# 测试覆盖率配置
[coverage:run]
source = app
omit =
    */tests/*
    */conftest.py
    */venv/*
    */.venv/*
    */__pycache__/*
    */migrations/*
    */alembic/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

# 并发测试配置
[pytest-parallel]
workers = auto
tests_per_worker = auto

# 超时配置
timeout = 300
timeout_method = thread

# JUnit XML报告
junit_family = xunit2
junit_suite_name = chaiwordduck-tests