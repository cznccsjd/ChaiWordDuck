# Nixpacks configuration file
# Explicitly define the environment to avoid PDM detection and ensure Python 3 is available

[phases.setup]
nixPkgs = ["python3", "postgresql", "gcc", "musl-dev"]

[phases.install]
dependsOn = ["setup"]
cmds = ["python3 -m pip install -r requirements-railway.txt"]

[start]
cmd = "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
