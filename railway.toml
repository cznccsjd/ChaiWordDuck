# Railway平台配置文件
# 明确定义Redis和PostgreSQL服务

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[api]
source = "backend"
environment = ["PORT=8000"]

[api.environmentVariables]
APP_NAME = "ChaiWord Duck API"
APP_ENV = "production"
DEBUG = "false"
# Force Nixpacks configuration
NIXPACKS_PKGS = "python311 postgresql gcc"
NIXPACKS_INSTALL_CMD = "python3 -m pip install -r requirements-railway.txt"
DATABASE_URL = "${{postgres.DATABASE_URL}}"
REDIS_URL = "${{redis.REDIS_URL}}"

# PostgreSQL数据库服务
[postgres]
image = "postgres:15-alpine"

[postgres.environmentVariables]
POSTGRES_USER = "postgres"
POSTGRES_PASSWORD = "password"
POSTGRES_DB = "chaiword_duck"

# Redis缓存服务
[redis]
image = "redis:7-alpine"

[redis.environmentVariables]
REDIS_PASSWORD = ""