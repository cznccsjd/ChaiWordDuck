# Nixpacks configuration file (Root Level)
# Explicitly define the environment to avoid PDM detection and ensure Python 3 is available

[phases.setup]
nixPkgs = ["python3", "postgresql", "gcc", "curl"]

[phases.install]
dependsOn = ["setup"]
cmds = [
    "python3 -m venv /app/.venv",
    ". /app/.venv/bin/activate && (python3 -m ensurepip || curl https://bootstrap.pypa.io/get-pip.py | python3)",
    ". /app/.venv/bin/activate && python3 -m pip install -r backend/requirements-railway.txt"
]

[start]
cmd = ". /app/.venv/bin/activate && cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
